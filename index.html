<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0b400">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر المالية">
<title>دفتر المالية</title>
<style>
:root{--bg:#fff;--line:#e3e3e8;--ink:#1d1d1f;--mute:#86868b;--acc:#f0b400;--accsoft:#fff3c4;--card:#f4f4f7;--good:#2e9e5b;--bad:#d9453b;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--line:#3a3a3d;--ink:#f2f2f4;--mute:#98989f;--accsoft:#4a3d0c;--card:#2a2a2d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px}
.top h1{margin:0;font-size:21px}
.ic{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px}
.mo{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mo h2{flex:1;text-align:center;margin:0;font-size:18px}
.nav{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:22px}
.nav[disabled]{opacity:.35}
.tab{padding:7px 14px;border-radius:999px;font-size:14px;border:1px solid var(--line);background:var(--card);white-space:nowrap}.tab.on{background:var(--acc);color:#241c00;border-color:var(--acc)}
.tot{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.tot small{color:var(--mute)}
.tot .big{font-size:28px;font-weight:700;display:block;margin:2px 0 6px}
.io{display:flex;gap:16px;font-size:14px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.users{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.uc{background:var(--card);border-radius:14px;padding:12px 14px;text-align:start;border:2px solid transparent;width:100%}
.uc.on{border-color:var(--acc);background:var(--accsoft)}
.uc .nm{display:flex;align-items:center;gap:7px;font-weight:600;margin-bottom:4px}
.uc small{color:var(--mute);display:block}
.uc .bal{font-size:21px;font-weight:700;display:block;margin-bottom:6px}
.uc .io{flex-direction:column;gap:2px;font-size:13.5px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.flt{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.inp{width:100%;min-height:46px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.dh{color:var(--mute);font-size:13.5px;padding:12px 4px 4px}
.tx{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:6px;border-radius:12px;background:var(--card);text-align:start;min-height:56px}
.tx .mid{flex:1;min-width:0}
.l1{display:flex;align-items:center;gap:8px;min-width:0}
.l1 b{flex:0 1 auto;min-width:0}
.who{font-size:12.5px;padding:2px 10px;border-radius:999px;white-space:nowrap;font-weight:600;flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{font-weight:700;white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:28px 10px}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--acc);color:#241c00;font-weight:700;padding:0 22px;height:54px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:17px;z-index:5}
.btn{min-height:46px;padding:0 16px;border-radius:12px;background:var(--acc);color:#241c00;font-weight:600;white-space:nowrap}
.btn.g{background:var(--card);color:var(--ink);font-weight:400;border:1px solid var(--line)}
.btn.d{background:rgba(217,69,59,.15);color:var(--bad)}
.row{display:flex;gap:8px;align-items:center}
dialog{border:0;border-radius:18px 18px 0 0;background:var(--bg);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 10px}
.lab{font-size:13.5px;color:var(--mute);margin:12px 0 5px}
dialog label{display:block;margin:10px 0 0;font-size:13.5px;color:var(--mute)}dialog label .inp{margin-top:4px;color:var(--ink)}
.seg2{display:flex;gap:8px}
.seg2 button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.seg2 button.on.out{background:rgba(217,69,59,.18);border-color:var(--bad);color:var(--bad)}
.seg2 button.on.in{background:rgba(46,158,91,.18);border-color:var(--good);color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px}.chip.on{background:var(--acc);color:#241c00;border-color:var(--acc);font-weight:600}
.amt-in{font-size:24px;font-weight:700;text-align:center}
.f{display:flex;flex-direction:column;gap:8px}
.urow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.urow span{flex:1}
dialog pre{direction:ltr;text-align:left;background:var(--card);padding:8px;border-radius:8px;overflow:auto;font-size:12px}
dialog ol{padding-inline-start:20px;line-height:1.9;font-size:14px}
#toast{position:fixed;inset-inline:0;margin:auto;width:max-content;max-width:90vw;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:7px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
#toast.on{opacity:.92}
#snack{position:fixed;inset-inline:0;margin:auto;width:max-content;max-width:92vw;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:6px 8px 6px 16px;border-radius:999px;font-size:15px;display:flex;align-items:center;gap:10px;z-index:60}
#snack[hidden]{display:none}
#snack button{background:var(--acc);color:#241c00;font-weight:700;border-radius:999px;padding:7px 16px}
dialog details>summary{padding:10px 0;font-weight:600;cursor:pointer}
dialog label.chk{display:flex;align-items:center;gap:10px;min-height:44px;margin:0;font-size:16px;color:var(--ink)}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<button class="fab" data-a="newTx">＋ حركة جديدة</button>
<div id="toast" role="status">تم الحفظ</div>
<div id="snack" hidden><span id="snt"></span><button data-a="undo">تراجع</button></div>
<dialog id="xd"></dialog>
<dialog id="st"></dialog>
<dialog id="md"></dialog>
<dialog id="sd"></dialog>
<input type="file" id="imp" accept=".json" hidden>
<script>
const KEY='daftar-v1',COL=['#f0b400','#2e9e5b','#4285f4','#d9453b','#a142f4','#00acc1','#ff7043','#8d6e63'];
const DEFCATS=['طعام','مواصلات','وقود','إيجار','فواتير','صيانة','رواتب','مشتريات'];
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>Number(n).toLocaleString('ar-EG',{maximumFractionDigits:2});
const money=n=>num(n)+' '+(S.cur||'ج.م');
const mk=d=>{d=new Date(d);return d.getFullYear()*12+d.getMonth()};
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fromYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12).getTime()};
const dm=()=>S.mo===mk(Date.now())?Date.now():new Date(Math.floor(S.mo/12),S.mo%12,15,12).getTime();
const newUser=n=>({id:uid(),name:n,c:COL[S.users.length%COL.length],m:Date.now()});
const shl=()=>S.users.length===2?'للاثنين':'للكل';
const uget=id=>id==='all'?{name:shl(),c:'#8d8d93'}:(S.users.find(u=>u.id===id)||{name:'—',c:'#999'});

function seed(){const u=uid();return{users:[{id:u,name:'أنا',c:COL[0],m:0}],tx:[],del:{},rec:[],me:u}}
const mig=()=>{S.tx=S.tx||[];S.del=S.del||{};S.rec=S.rec||[];
if(!S.users||!S.users.length)S.users=[{id:uid(),name:'أنا',c:COL[0],m:0}];
if(!S.users.some(u=>u.id===S.me))S.me=S.users[0].id;
const fx=o=>{if(o.type==='in'){if(o.u!=='all'){o.u='all';o.m=Date.now();S.u=Date.now();mg=1}}else if(!S.users.some(u=>u.id===o.u))o.u=S.users[0].id;o.m=o.m||0};
let mg=0;S.tx.forEach(fx);S.rec.forEach(fx);if(mg)keep();
S.mo=S.mo??mk(Date.now());S.cur=S.cur||'ج.م';S.all=!!S.all;
if(S.uf&&S.uf!=='all'&&!S.users.some(u=>u.id===S.uf))S.uf='all';S.uf=S.uf||'all'};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=S||seed();mig();S.q='';

let tm,pt,asked=false,lastDel=null,snt,inst=null;
function snack(t){$('#snt').textContent=t;$('#snack').hidden=false;clearTimeout(snt);snt=setTimeout(()=>{$('#snack').hidden=true},8000)}
function keep(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(q){S.u=Date.now();clearTimeout(pt);pt=setTimeout(push,1200);keep();if(q)return;const t=$('#toast');t.textContent='تم الحفظ';t.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('on'),900)}

/* ---------- حسابات ---------- */
const per=x=>S.all||mk(x.d)===S.mo;
const base=()=>S.tx.filter(per);
const sumOf=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+(+x.amt||0),0);

/* ---------- العرض ---------- */
function renderSum(){const a=base(),inc=sumOf(a,'in'),out=sumOf(a,'out'),bal=inc-out;
$('#sm').innerHTML=`<div class="tot"><small>الإجمالي (اللي في الصندوق)</small><span class="big ${bal<0?'neg':'pos'}">${money(bal)}</span><div class="io"><span class="pos">دخل (${shl()}) ${money(inc)}</span><span class="neg">صرف ${money(out)}</span></div></div>
<div class="users">${S.users.map(u=>{const o=sumOf(a.filter(x=>x.u===u.id),'out'),pc=out?Math.round(o/out*100):0;
return`<button class="uc${S.uf===u.id?' on':''}" data-a="pickUser" data-id="${u.id}"><span class="nm"><i class="dot" style="background:${u.c}"></i>${esc(u.name)}</span><small>صرّف</small><span class="bal ${o>0?'neg':''}">${money(o)}</span><div class="io"><span>${num(pc)}٪ من إجمالي الصرف</span></div></button>`}).join('')}</div>`}
function renderList(){const q=S.q.trim();
const rows=base().filter(x=>S.uf==='all'||x.u===S.uf).filter(x=>!q||((x.cat||'')+(x.note||'')+uget(x.u).name).includes(q)).sort((a,b)=>b.d-a.d||(b.m||0)-(a.m||0));
let h='',last='';
rows.forEach(x=>{const k=ymd(x.d);if(k!==last){last=k;h+=`<div class="dh">${new Date(x.d).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}</div>`}
const u=uget(x.u);
h+=`<button class="tx" data-a="editTx" data-id="${x.id}"><i class="dot" style="background:${u.c}"></i><span class="mid"><span class="l1"><b>${esc((x.cat||'').trim()||'بدون بند')}</b><span class="who" style="background:${u.c}30">${esc(u.name)}</span></span>${x.note?`<small>${esc(x.note)}</small>`:''}</span><span class="amt ${x.type==='in'?'pos':'neg'}">${x.type==='in'?'+':'−'} ${money(x.amt)}</span></button>`});
$('#lst').innerHTML=h||'<p class="empty">لا توجد حركات في هذه الفترة.<br>اضغط «حركة جديدة» لإضافة أول حركة.</p>'}
function genRec(){let add=0;const cur=mk(Date.now()),t0=new Date();t0.setHours(0,0,0,0);
S.rec.forEach(r=>{for(let k=Math.max(r.from??cur,cur-24);k<=cur;k++){const y=Math.floor(k/12),mo=k%12,dd=Math.min(r.day||1,new Date(y,mo+1,0).getDate());
if(new Date(y,mo,dd).getTime()>t0.getTime())continue;const id='r_'+r.id+'_'+k;if(S.del[id]||S.tx.some(x=>x.id===id))continue;
S.tx.push({id,type:r.type,u:r.u,cat:r.cat,amt:r.amt,note:r.note||'',d:new Date(y,mo,dd,12).getTime(),m:Date.now()});add++}});return add>0}
function render(){
if(genRec())save(1);
$('#app').innerHTML=`<div class="top"><h1>💰 دفتر المالية${sync?' <small style="font-size:14px">☁️</small>':''}${navigator.onLine?'':' <small style="font-size:13px;color:var(--mute)">📴 بدون نت</small>'}</h1><div class="row"><button class="tab on" data-a="askMe" aria-label="صاحب الجهاز">👤 ${S.meSet?esc(uget(S.me).name):'اختار اسمك'}</button><button class="ic" data-a="openSt" aria-label="الإعدادات">⚙️</button></div></div>
${getCfg()?'':'<button class="tab" data-a="syncCfg" style="width:100%;margin-bottom:10px;padding:10px">☁️ هتستخدمه على جهازين؟ فعّل المزامنة</button>'}
<div class="mo"><button class="nav" data-a="mogo" data-id="-1"${S.all?' disabled':''} aria-label="الشهر السابق">›</button><h2>${S.all?'كل الفترات':new Date(Math.floor(S.mo/12),S.mo%12,1).toLocaleDateString('ar-EG',{month:'long',year:'numeric'})}</h2><button class="nav" data-a="mogo" data-id="1"${S.all?' disabled':''} aria-label="الشهر التالي">‹</button></div>
<div class="flt"><button class="tab${S.all?'':' on'}" data-a="allp" data-id="0">الشهر</button><button class="tab${S.all?' on':''}" data-a="allp" data-id="1">كل الفترات</button>${S.uf!=='all'?`<button class="tab on" data-a="clrUf">${esc(uget(S.uf).name)} ✕</button>`:''}</div>
<div id="sm"></div>
<input class="inp" id="q" placeholder="بحث في البند أو الملاحظة" value="${esc(S.q)}" aria-label="بحث" style="margin-bottom:4px">
<div id="lst"></div>`;renderSum();renderList();
if(!S.meSet&&(sync||S.users.length>1)&&!asked&&!$('#xd').open&&!$('#st').open&&!$('#md').open){asked=true;askMe()}}

/* ---------- نافذة الحركة ---------- */
function openTx(id){const x=id?S.tx.find(t=>t.id===id):null,type=x?x.type:(S.lt||'out'),u=x&&x.u!=='all'?x.u:S.me;
const cats=[...new Set([...S.tx.slice().sort((a,b)=>b.d-a.d).map(t=>(t.cat||'').trim()).filter(Boolean),...DEFCATS])].slice(0,8);
$('#xd').innerHTML=`<form id="xf" class="f" data-id="${id||''}"><h3>${x?'تعديل حركة':'حركة جديدة'}</h3>
<div class="seg2"><button type="button" class="${type==='out'?'on out':''}" data-a="setType" data-id="out">🔴 صرف</button><button type="button" class="${type==='in'?'on in':''}" data-a="setType" data-id="in">🟢 دخل</button></div><input type="hidden" name="type" value="${type}">
<input class="inp amt-in" name="amt" type="number" min="0" step="any" inputmode="decimal" placeholder="المبلغ" required value="${x?x.amt:''}" aria-label="المبلغ">
<input class="inp" name="cat" list="cats" placeholder="في إيه؟" required autocomplete="off" value="${x?esc(x.cat||''):''}" aria-label="البند"><datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
<div class="chips">${cats.slice(0,6).map(c=>`<button type="button" class="chip" data-a="setCat" data-id="${esc(c)}">${esc(c)}</button>`).join('')}</div>
${S.users.length>1?`<div id="uw"${type==='in'?' hidden':''}><div class="lab" style="margin:2px 0 0">مين اللي صرف؟</div><div class="chips">${S.users.map(s=>`<button type="button" class="chip${s.id===u?' on':''}" data-a="setU" data-id="${s.id}">${esc(s.name)}</button>`).join('')}</div></div><p id="sh" class="lab" style="margin:2px 0 0"${type==='in'?'':' hidden'}>💡 الدخل بيتسجل ${shl()} (مش على مستخدم معيّن)</p>`:''}<input type="hidden" name="u" value="${u}">
<details${x&&(x.note||ymd(x.d)!==ymd(Date.now()))?' open':''}><summary style="color:var(--mute);padding:6px 0">＋ ملاحظة أو تاريخ تاني</summary><div class="f"><input class="inp" name="note" placeholder="ملاحظة (اختياري)" autocomplete="off" value="${x?esc(x.note||''):''}" aria-label="ملاحظة"><input class="inp" name="d" type="date" value="${ymd(x?x.d:dm())}" aria-label="التاريخ"></div></details>
${x?'':'<label class="chk"><input type="checkbox" name="rep"> 🔁 كرر كل شهر في نفس اليوم</label>'}
<div class="row" style="margin-top:6px"><button class="btn" style="flex:1">حفظ</button>${x?`<button type="button" class="btn d" data-a="delTx" data-id="${id}">حذف</button>`:''}<button type="button" class="btn g" data-a="closeX">إلغاء</button></div></form>`;
if(!$('#xd').open)$('#xd').showModal();if(!x)setTimeout(()=>{const a=$('#xf');a&&a.elements.amt.focus()},60)}

/* ---------- صاحب الجهاز ---------- */
function askMe(){$('#md').innerHTML=`<h3>مين صاحب الجهاز ده؟</h3><p style="margin:0 0 4px;font-size:14px;line-height:1.8;color:var(--mute)">كل حركة هتتسجل باسمك تلقائياً وهيظهر اسمك جنبها. <b>كل شخص ليه اسم لوحده</b>، فلو إنت شخص جديد اكتب اسمك تحت.</p>
${S.users.length?`<div class="lab">أنا واحد من دول:</div><div class="chips">${S.users.map(u=>`<button class="chip${S.meSet&&u.id===S.me?' on':''}" data-a="setMe" data-id="${u.id}"><i class="dot" style="background:${u.c};margin-inline-end:6px"></i>${esc(u.name)}</button>`).join('')}</div>`:''}
<div class="lab">أو أنا شخص جديد:</div><form id="mef" class="row"><input class="inp" name="n" placeholder="اكتب اسمك" autocomplete="off" required><button class="btn">ابدأ</button></form>`;if(!$('#md').open)$('#md').showModal()}

/* ---------- الإعدادات والمستخدمون ---------- */
function catList(){const m={};S.tx.forEach(x=>{const k=(x.cat||'').trim();if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
const isApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function openSt(sec){const cl=catList();
$('#st').innerHTML=`<h3>الإعدادات</h3>
${isApp()?'':inst?'<button class="btn" data-a="install" style="width:100%;margin-bottom:10px">📲 ثبّت التطبيق على الشاشة الرئيسية</button>':'<details><summary>📲 تثبيت كتطبيق على الموبايل</summary><p style="font-size:14px;line-height:1.9;color:var(--mute);margin:0 0 8px">أندرويد (Chrome): القائمة ⋮ ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».<br>آيفون (Safari): زرار المشاركة ثم «إضافة إلى الشاشة الرئيسية».</p></details>'}

if(S.me===id)S.me=S.users[0].id;if(S.uf===id)S.uf='all';save();render();openSt()},
syncCfg(){openSd()},

try{const c=unb64(t);if(!(c.p&&c.k&&c.c))throw 0;localStorage.setItem('daftar-sync',JSON.stringify(c));sync=null;sdErr('⏳ بيتصل...',1);syncInit().then(()=>{render();openSd()})}catch(e){sdErr('الرابط أو الكود غير صالح')}},

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a]?.(b.dataset.id)});
document.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);
if(e.target.id==='mef'){const n=f.get('n').trim();if(!n)return;let u=S.users.find(x=>x.name===n);if(!u){u=newUser(n);S.users.push(u)}S.me=u.id;S.meSet=true;save();$('#md').close();render();return}
if(e.target.id==='xf'&&e.target.dataset.kind==='rec'){const amt=+f.get('amt'),day=Math.min(31,Math.max(1,parseInt(f.get('day'))||1));if(!(amt>0))return alert('اكتب مبلغاً أكبر من صفر');
const id=e.target.dataset.id,rec={type:f.get('type'),u:f.get('type')==='in'?'all':f.get('u'),cat:f.get('cat').trim(),amt,note:f.get('note').trim(),day,m:Date.now()};
if(id)Object.assign(S.rec.find(x=>x.id===id),rec);else{const t=new Date();rec.id=uid();rec.from=day>=t.getDate()?mk(t):mk(t)+1;S.rec.push(rec)}
save();$('#xd').close();render();openSt('rec');return}
if(e.target.id==='xf'){const amt=+f.get('amt');if(!(amt>0))return alert('اكتب مبلغاً أكبر من صفر');const d=fromYmd(f.get('d')||ymd(Date.now())),id=e.target.dataset.id;let rep=0;
const rec={type:f.get('type'),u:f.get('type')==='in'?'all':f.get('u'),cat:f.get('cat').trim(),amt,note:f.get('note').trim(),d,m:Date.now()};
if(id)Object.assign(S.tx.find(x=>x.id===id),rec);else{S.tx.push({id:uid(),...rec});if(f.get('rep')){const dd=new Date(d).getDate(),t=new Date(),cand=dd>t.getDate()?mk(t):mk(t)+1;S.rec.push({id:uid(),type:rec.type,u:rec.u,cat:rec.cat,amt,note:rec.note,day:dd,from:Math.max(mk(d)+1,cand),m:Date.now()});rep=dd}}
S.lt=rec.type;if(!S.all)S.mo=mk(d);save();$('#xd').close();render();if(rep)cloudMsg('🔁 هتتسجل لوحدها كل شهر يوم '+num(rep));return}
if(e.target.id==='nuf'){const n=f.get('n').trim();if(!n)return;if(S.users.some(u=>u.name===n))return alert('هذا الاسم موجود بالفعل');S.users.push(newUser(n));save();render();openSt()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;renderList()}});
document.addEventListener('change',e=>{const t=e.target;
if(t.id==='cur'){S.cur=t.value;save();render();return}
if(t.id==='imp'){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0;merge(d);save();render();cloudMsg('تم استيراد البيانات ودمجها')}catch(_){alert('ملف غير صالح')}t.value=''};r.readAsText(t.files[0])}});

/* ---------- دمج البيانات (حتى لا يمسح جهازٌ حركات جهاز آخر) ---------- */
function merge(d){S.del=S.del||{};for(const k in(d.del||{}))S.del[k]=Math.max(S.del[k]||0,d.del[k]);
const un=(a,b)=>{const m=new Map();[...(a||[]),...(b||[])].forEach(x=>{const o=m.get(x.id);if(!o||(x.m||0)>(o.m||0))m.set(x.id,x)});return[...m.values()].filter(x=>!(S.del[x.id]&&S.del[x.id]>=(x.m||0)))};
S.tx=un(S.tx,d.tx);S.users=un(S.users,d.users);S.rec=un(S.rec,d.rec);
if(S.users.length>1)S.users=S.users.filter(u=>u.m||S.tx.some(x=>x.u===u.id)||S.rec.some(x=>x.u===u.id));
if(d.cur)S.cur=d.cur;mig()}

/* ---------- مزامنة سحابية (Firestore) ---------- */
let sync=null,busy=false,again=false;const CH=60000;
const cloudMsg=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>{e.classList.remove('on');e.textContent='تم الحفظ'},1800)};
function getCfg(){try{const c=JSON.parse(localStorage.getItem('daftar-sync'));return c&&c.p&&c.k&&c.c?c:null}catch(e){return null}}
function fsAdapter(c){const base=`https://firestore.googleapis.com/v1/projects/${encodeURIComponent(c.p)}/databases/(default)/documents/notebooks/`,q=`?key=${encodeURIComponent(c.k)}`;
return{doc:id=>({async get(){const r=await fetch(base+c.c+'_'+id+q);if(r.status===404)return{exists:false,data:()=>null};if(!r.ok)throw new Error(r.status);const f=(await r.json()).fields||{},o={};for(const k in f)o[k]=f[k].stringValue!==undefined?f[k].stringValue:+f[k].integerValue;return{exists:true,data:()=>o}},
async set(d){const f={};for(const k in d)f[k]=typeof d[k]==='string'?{stringValue:d[k]}:{integerValue:String(d[k])};const r=await fetch(base+c.c+'_'+id+q,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:f})});if(!r.ok)throw new Error(r.status)}})}}
async function syncInit(){try{const c=getCfg();if(c){sync=fsAdapter(c)}else{if(!window.claude||!claude.use)return;const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;sync=db.collection('data/users/'+id)}
const merged=await pull(true);if(merged||(S.u||0)>(S.cu||0))await push();render()}catch(e){sync=null;console.warn(e);if(getCfg())cloudMsg('⚠️ تعذّر الاتصال بالمزامنة، تحقق من الإعدادات')}}
async function pull(first){const m=await sync.doc('meta').get(),md=m.exists?m.data():null;
if(md&&(md.u||0)>(S.cu||0)){let j='';for(let i=0;i<md.n;i++)j+=(await sync.doc('c'+i).get()).data().t;merge(JSON.parse(j));S.cu=md.u;keep();if(!$('#xd').open)render();cloudMsg('☁️ تم تحديث البيانات');return true}
if(first&&!md)await push();return false}
async function push(){if(!sync)return;if(busy){again=true;return}busy=true;
try{await pull(false);S.u=Date.now();const{notes,tasks,folders,...P}=S,j=JSON.stringify(P);let a=0,n=0;do{let b=Math.min(j.length,a+CH);if(b<j.length&&(j.charCodeAt(b-1)&0xFC00)===0xD800)b--;await sync.doc('c'+n).set({t:j.slice(a,b)});a=b;n++}while(a<j.length);
await sync.doc('meta').set({u:S.u,n});S.cu=S.u;keep();cloudMsg('☁️ تمت المزامنة')}catch(e){cloudMsg('⚠️ تعذّرت المزامنة، البيانات محفوظة على هذا الجهاز')}
busy=false;if(again){again=false;push()}}
document.addEventListener('visibilitychange',()=>{if(sync&&!document.hidden)pull(false).then(m=>m&&push()).catch(()=>{})});
/* ---------- ربط الأجهزة بسهولة ---------- */
const RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /notebooks/{id} {
      allow get: if true;
      allow create, update: if request.resource.data.keys().hasOnly(['t','u','n']);
    }
  }
}`;
const b64=o=>btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=t=>JSON.parse(atob(t.replace(/-/g,'+').replace(/_/g,'/')));
const linkOf=c=>location.origin+location.pathname+'#join='+b64(c);
function joinFromHash(){const m=location.hash.match(/^#join=(.+)$/);if(!m)return false;let ok=false;
try{const c=unb64(m[1]);if(c.p&&c.k&&c.c){localStorage.setItem('daftar-sync',JSON.stringify(c));ok=true}}catch(e){}
history.replaceState(null,'',location.pathname+location.search);return ok}
async function testCfg(c){const a=fsAdapter(c);try{await a.doc('meta').get();await a.doc('ping').set({t:'ok'});return null}catch(e){const m=String(e.message);
if(m==='403')return'القواعد (Rules) لسه ما اتنشرتش أو فيها غلط. افتح تبويب Rules في Firestore، الصق القواعد واضغط Publish.';
if(m==='400'||m==='401')return'معرّف المشروع أو المفتاح غلط، راجعهم.';
if(m==='404')return'قاعدة بيانات Firestore لسه ما اتعملتش. من Firebase: Build ← Firestore Database ← Create database.';
return'مفيش اتصال بالإنترنت أو الإعدادات غلط. حاول تاني.'}}

const head='<h3>ربط الجهازين ☁️</h3>';
const err='<p id="sderr" style="min-height:1.2em;margin:8px 0 0;font-size:14px"></p>';
const close='<button class="btn g" data-a="closeSd">إغلاق</button>';
const adv=`<details style="margin-top:12px"><summary>إعدادات متقدمة</summary><label>معرّف المشروع (Project ID)<input class="inp" id="sp" dir="ltr" autocomplete="off" value="${esc((c||{}).p||'')}"></label><label>مفتاح الواجهة (API Key)<input class="inp" id="sk" dir="ltr" autocomplete="off" value="${esc((c||{}).k||'')}"></label><label>كود المزامنة<input class="inp" id="sc" dir="ltr" autocomplete="off" value="${esc((c||{}).c||'')}"></label><div class="row" style="margin-top:10px"><button class="btn g" data-a="saveSync">حفظ</button></div></details>`;
if(c){$('#sd').innerHTML=`${head}<p style="margin:0 0 8px">الحالة: <b>${sync?'☁️ شغّالة':'⚠️ مش متصل حالياً'}</b></p>
<p style="font-size:14px;color:var(--mute);line-height:1.8;margin:0 0 12px">عشان تربط جهاز تاني: ابعتله الرابط، وخليه يفتحه في <b>Chrome</b> (لو فتحه جوه واتساب يختار «فتح في المتصفح»). الجهاز هيتربط لوحده ويسأله مين صاحبه.</p>
